# Server Configuration
server.port=8080

# Spring Application Info
spring.application.name=StockPulse Engine

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Async Thread Pool Settings
stockpulse.async.core-pool-size=5
stockpulse.async.max-pool-size=20
stockpulse.async.queue-capacity=100
stockpulse.async.thread-name-prefix=StockPulse-Async-

# CORS Configuration
stockpulse.cors.allowed-origins=http://localhost:5175,http://localhost:5173,http://localhost:5174,http://localhost:5176,http://localhost:3000,http://127.0.0.1:5175,http://127.0.0.1:5173
